---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="kicker"><a href="{{ '/writing/' | relative_url }}">Writing</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time></p>
  </header>
  {% if page.placeholder %}
  <aside class="banner" role="note">
    <strong>Draft placeholder.</strong>
    This note is not finished and does not report results.
  </aside>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
